name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar banco de dados (JSON)
        run: python3 -c "import json; json.load(open('sbot_cbhpm_tuss_v1.json')); print('sbot_cbhpm_tuss_v1.json ok')"

      - name: Preparar site
        run: |
          mkdir -p site
          shopt -s extglob dotglob
          cp -r !(site|.git|.github|tools) site/
          touch site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
